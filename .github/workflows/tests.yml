name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    # The offline checks only: no archive, no turboSETI, no BLISS, no data/.
    # Windows too: the published records were made on Windows. macOS and 3.13
    # because the README offers them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the whole history: tests/test_onoff_equivalent.py reads an earlier onoff.py
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      # The commands a newcomer types first, without the archive.
      - run: python seti.py --help
      - run: python check.py --help
      - run: python tools/evidence.py --help
