name: quick start

# The README's quick start against Breakthrough Listen's archive (about
# 100 MB read). By hand only, from the Actions tab: the archive is shared.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python tests/integration_quickstart.py
